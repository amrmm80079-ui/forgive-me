<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Did You Forgive Me? 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;

      font-family:
        "Comic Sans MS",
        "Trebuchet MS",
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 15%,
          #fff5fa 0%,
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 85%,
          #f5d7ff 0%,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ffd6e7,
          #ffeaf3,
          #f5d5ff
        );

      display: flex;
      justify-content: center;
      align-items: center;

      position: relative;
    }

    /* =========================
       FLOATING HEARTS
    ========================== */

    .heart {
      position: fixed;
      bottom: -50px;

      color: rgba(255, 80, 150, 0.35);

      font-size: 25px;

      pointer-events: none;

      animation:
        floatHeart 7s linear infinite;
    }

    @keyframes floatHeart {

      0% {
        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      100% {
        transform:
          translateY(-115vh)
          rotate(360deg);

        opacity: 0;
      }
    }

    /* =========================
       CARD
    ========================== */

    .card {
      width: min(90vw, 480px);

      min-height: 400px;

      padding: 40px 25px;

      background:
        rgba(255, 255, 255, 0.78);

      backdrop-filter: blur(15px);

      border:
        2px solid
        rgba(255, 255, 255, 0.9);

      border-radius: 35px;

      box-shadow:
        0 20px 60px
        rgba(190, 70, 120, 0.20);

      text-align: center;

      position: relative;

      z-index: 10;
    }

    /* =========================
       EMOJI
    ========================== */

    .emoji {
      font-size: 65px;

      animation:
        bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform:
          translateY(-10px)
          rotate(4deg);
      }
    }

    /* =========================
       TEXT
    ========================== */

    h1 {
      margin:
        15px 0 10px;

      color: #d94f87;

      font-size: 31px;

      line-height: 1.2;
    }

    p {
      color: #a05b7b;

      font-size: 17px;

      margin:
        0 0 20px;
    }

    /* =========================
       BUTTON AREA
    ========================== */

    .buttons {
      position: relative;

      width: 100%;

      height: 150px;

      margin-top: 10px;

      overflow: hidden;

      border-radius: 20px;
    }

    /* =========================
       ALL BUTTONS
    ========================== */

    button {
      border: none;

      border-radius: 999px;

      padding:
        14px 28px;

      font-family: inherit;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(190, 70, 120, 0.18);

      white-space: nowrap;
    }

    /* =========================
       YES
    ========================== */

    #yes {
      position: absolute;

      left: 50%;

      top: 50%;

      transform:
        translate(
          calc(-100% - 10px),
          -50%
        );

      color: white;

      background:
        linear-gradient(
          135deg,
          #ff65a5,
          #e83d82
        );

      z-index: 20;

      transition:
        transform 0.2s ease;
    }

    #yes:hover {
      transform:
        translate(
          calc(-100% - 10px),
          -50%
        )
        scale(1.08);
    }

    /* =========================
       NO
    ========================== */

    #no {
      position: absolute;

      left: calc(50% + 10px);

      top: 50%;

      transform:
        translateY(-50%);

      color: #d94f87;

      background: white;

      z-index: 30;

      transition:
        left 0.25s ease,
        top 0.25s ease;
    }

    /* =========================
       SUCCESS
    ========================== */

    #success {
      display: none;
    }

    .big-heart {
      font-size: 90px;

      animation:
        heartbeat 1s ease-in-out infinite;
    }

    @keyframes heartbeat {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    .success-title {
      font-size: 36px;
    }

    .sparkles {
      color: #ff72aa;

      font-size: 25px;

      letter-spacing: 7px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 500px) {

      .card {
        width: 92vw;

        min-height: 390px;

        padding:
          35px 18px;
      }

      .emoji {
        font-size: 58px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }

      .buttons {
        height: 160px;
      }

      button {
        padding:
          12px 23px;

        font-size: 16px;
      }

      .success-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       FLOATING HEARTS
  ========================== -->

  <div class="heart" style="left: 5%; animation-delay: 0s;">♡</div>
  <div class="heart" style="left: 15%; animation-delay: 2s;">💗</div>
  <div class="heart" style="left: 30%; animation-delay: 4s;">♡</div>
  <div class="heart" style="left: 48%; animation-delay: 1s;">💕</div>
  <div class="heart" style="left: 65%; animation-delay: 3s;">♡</div>
  <div class="heart" style="left: 80%; animation-delay: 5s;">💗</div>
  <div class="heart" style="left: 93%; animation-delay: 2.5s;">♡</div>

  <!-- =========================
       CARD
  ========================== -->

  <div class="card">

    <!-- QUESTION -->

    <div id="question">

      <div class="emoji">
        🥺
      </div>

      <h1>
       لسه زعلانه? 💗
      </h1>

      <p>
        جوجووووووووووووووووو 🎀
      </p>

      <div class="buttons">

        <button id="yes">
          مش زعلانه  💕
        </button>

        <button id="no">
          اه 😭
        </button>

      </div>

    </div>

    <!-- =========================
         SUCCESS
    ========================== -->

    <div id="success">

      <div class="big-heart">
        💖
      </div>

      <h1 class="success-title">
        Thank you Jojo! 🥹💕
      </h1>

      <p>
       احلا بطايه هااااااااااااااااااا 🎀✨
      </p>

      <div class="sparkles">
        ♡ ✨ ♡ ✨ ♡
      </div>

    </div>

  </div>

  <script>

    const noButton =
      document.getElementById("no");

    const yesButton =
      document.getElementById("yes");

    const buttonsArea =
      document.querySelector(".buttons");

    const question =
      document.getElementById("question");

    const success =
      document.getElementById("success");


    /* =========================
       MOVE NO BUTTON
    ========================== */

    function moveNoButton() {

      const areaWidth =
        buttonsArea.clientWidth;

      const areaHeight =
        buttonsArea.clientHeight;

      const buttonWidth =
        noButton.offsetWidth;

      const buttonHeight =
        noButton.offsetHeight;

      const padding = 5;

      const maxX =
        Math.max(
          padding,
          areaWidth -
          buttonWidth -
          padding
        );

      const maxY =
        Math.max(
          padding,
          areaHeight -
          buttonHeight -
          padding
        );

      const x =
        padding +
        Math.random() *
        Math.max(
          0,
          maxX - padding
        );

      const y =
        padding +
        Math.random() *
        Math.max(
          0,
          maxY - padding
        );

      noButton.style.transform =
        "none";

      noButton.style.left =
        `${x}px`;

      noButton.style.top =
        `${y}px`;

  const messages = [
  "لأ ",
  "فكري تاني 🥺",
  "لأ بقىاا  😡",
  "متقوليش لأ 💗",
  "إنتي متأكدة؟ 😭",
  "طب فكري فيها كده 🎀",
  "لأ يا جوجو 😭",
  "بلاش العند ده بقى  😡",
  "حرام عليكي 😭💗",
  "طب هاتي فرصة كمان 🥹",
  "إنتي قلبك قاسي كده؟ 😭",
  "يا بنتي وافقي بقى 😂💕",
  "لأ لأ... مش هسيبك 😭",
  "آخر مرة... فكري تاني 🥺💗",
  "كفاية عناد 😡"
];

      noButton.textContent =
        messages[
          Math.floor(
            Math.random() *
            messages.length
          )
        ];
    }


    /* =========================
       DESKTOP
    ========================== */

    noButton.addEventListener(
      "mouseenter",
      moveNoButton
    );


    /* =========================
       MOBILE
    ========================== */

    noButton.addEventListener(
      "touchstart",
      function(event) {

        event.preventDefault();

        moveNoButton();

      },
      {
        passive: false
      }
    );


    /* =========================
       CLICK NO
    ========================== */

    noButton.addEventListener(
      "click",
      function(event) {

        event.preventDefault();

        moveNoButton();

      }
    );


    /* =========================
       YES
       SEND TO FORMSPREE
    ========================== */

    yesButton.addEventListener(
      "click",
      async function() {

        /*
          منع الضغط أكثر من مرة
        */

        yesButton.disabled = true;

        yesButton.textContent =
          "Sending... 💗";


        /*
          البيانات التي ستصل إلى Formspree
        */

        const formData =
          new FormData();

        formData.append(
          "message",
          "Jojo forgave you! 💗"
        );

        formData.append(
          "subject",
          "Jojo Forgave Me! 💕"
        );

        formData.append(
          "event",
          "Yes button clicked"
        );

        formData.append(
          "time",
          new Date().toLocaleString()
        );


        try {

          /*
            إرسال البيانات إلى Formspree
          */

          const response =
            await fetch(
              "https://formspree.io/f/xdekznpg",
              {
                method: "POST",

                body: formData,

                headers: {
                  "Accept":
                    "application/json"
                }
              }
            );


          /*
            لو الإرسال نجح
          */

          if (response.ok) {

            question.style.display =
              "none";

            success.style.display =
              "block";


            /*
              قلوب احتفالية
            */

            for (
              let i = 0;
              i < 35;
              i++
            ) {

              createConfetti();

            }

          }

          /*
            لو حصل خطأ
          */

          else {

            throw new Error(
              "Formspree submission failed"
            );

          }

        }

        catch (error) {

          console.error(error);

          alert(
            "Oops! Something went wrong 😭 Please try again."
          );

          yesButton.disabled =
            false;

          yesButton.textContent =
            "Yes 💕";

        }

      }
    );


    /* =========================
       CONFETTI
    ========================== */

    function createConfetti() {

      const confetti =
        document.createElement("div");

      const emojis = [

        "💗",
        "💕",
        "💖",
        "✨",
        "🎀",
        "♡"

      ];

      confetti.textContent =
        emojis[
          Math.floor(
            Math.random() *
            emojis.length
          )
        ];

      confetti.style.position =
        "fixed";

      confetti.style.left =
        Math.random() * 100 + "vw";

      confetti.style.top =
        "-30px";

      confetti.style.fontSize =
        20 +
        Math.random() * 20 +
        "px";

      confetti.style.zIndex =
        "99999";

      confetti.style.pointerEvents =
        "none";

      document.body.appendChild(
        confetti
      );

      const duration =
        2000 +
        Math.random() * 2500;

      confetti.animate(

        [
          {
            transform:
              "translateY(0) rotate(0deg)",

            opacity: 1
          },

          {
            transform:
              `translateY(110vh)
               rotate(${
                 Math.random() * 720 - 360
               }deg)`,

            opacity: 0
          }
        ],

        {
          duration:
            duration,

          easing:
            "ease-out"
        }

      );

      setTimeout(
        () => confetti.remove(),
        duration
      );

    }

  </script>

</body>
</html>
```
